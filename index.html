<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyntaxWear - Tênis e Sneakers Online</title>
    <link rel="stylesheet" href="./src/css/reset.css">
    <link rel="stylesheet" href="./src/css/variables.css">
    <link rel="stylesheet" href="./src/css/base.css">
    <link rel="stylesheet" href="./src/css/layout.css">

    <link rel="stylesheet" href="./src/css/components/header.css">
    <link rel="stylesheet" href="./src/css/components/hero.css">
    <link rel="stylesheet" href="./src/css/components/product-category.css">
    <link rel="stylesheet" href="./src/css/components/product-grid.css">

</head>

<body>
    <header class="header">
        <!-- Logo e navegação -->
        <h1 class="logo">
            <a href="/" title="SyntaxWear - Tênis e Sneakers Online">
                <img src="./src/images/logo/logo.svg" alt="SyntaxWear - Tênis e Sneakers Online" />
            </a>
        </h1>


        <nav class="nav-center" aria-label="Categorias Principais">
            <ul role="list">
                <li><a href="#">Masculino</a></li>
                <li><a href="#">Feminino</a></li>
                <li><a href="#">Outlet</a></li>
            </ul>
        </nav>

        <nav class="nav-right" aria-label="Acesso rápido">
            <ul>
                <li><a href="#">Nossas lojas</a></li>
                <li><a href="#">Sobre</a></li>
                <li>
                    <a href="#" aria-label="Minha conta">
                        <img src="./src/images/icons/user.svg" alt="Minha conta" />
                    </a>
                </li>
                <li>
                    <a href="#" aria-label="Ajuda">
                        <img src="./src/images/icons/help.svg" alt="Ajuda" />
                    </a>
                </li>
                <li>
                    <a href="#" aria-label="Carrinho">
                        <img src="./src/images/icons/bag.svg" alt="Carrinho" />
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero-section" aria-label="Apresentação">
            <!-- Seção hero -->
            <div class="hero-overlay">
                <div class="hero-content">
                    <span class="hero-subtitle">Krypton One</span>
                    <h2 class="hero-title">Transforme qualquer passo em presença.</h2>
                    <div class="hero-buttons">
                        <a class="btn btn-outline" href="#">Ver modelos</a>
                        <a class="btn btn-filled" href="#">Comprar</a>
                    </div>
                </div>
            </div>
        </section>

        <section class="categories-section" aria-label="Categorias de tênis">
            <!-- Seção de categorias de tênis -->
            <div class="category-card casual">
                <a href="#" class="category-link">
                    <span class="overlay"></span>
                    <span class="category-name btn btn-outline">Casual</span>
                </a>
            </div>
            <div class="category-card esporte">
                <a href="#" class="category-link">
                    <span class="overlay"></span>
                    <span class="category-name btn btn-outline">Esporte</span>
                </a>
            </div>
            <div class="category-card moderno">
                <a href="#" class="category-link">
                    <span class="overlay"></span>
                    <span class="category-name btn btn-outline">Moderno</span>
                </a>
            </div>
            <div class="category-card futurista">
                <a href="#" class="category-link">
                    <span class="overlay"></span>
                    <span class="category-name btn btn-outline">Futurista</span>
                </a>
            </div>
        </section>

        <section class="grid-section" aria-label="Produtos em destaque">
            <!-- Products Grid -->
            <div class="card highlight">
                <div class="top1-content">
                    <h3 class="card-title">Krypton One</h3>
                    <p class="card-subtitle">Estilo Urbano com atitude</p>
                    <div class="cta-group">
                        <a href="#" class="btn btn-outline">Feminino</a>
                        <a href="#" class="btn btn-outline">Masculino</a>
                    </div>
                </div>
            </div>
            <div class="card sneaker-purple"></div>
            <div class="card model"></div>
            <div class="card sneaker-color"></div>
            <div class="card sneaker-white"></div>
            <div class="card sneaker-silver"></div>
        </section>
    </main>

    <footer class="site-footer">
        <address class="contact-information" aria-label="Informações de contato"></address>

        <nav class="footer-navigation" aria-label="Links do rodapé">
            <ul role="list">
                <li><a href="#inicio">Início</a></li>
                <li><a href="#categorias">Categorias</a></li>
                <li><a href="#destaques">Destaques</a></li>
            </ul>
        </nav>
    </footer>
</body>

</html>
